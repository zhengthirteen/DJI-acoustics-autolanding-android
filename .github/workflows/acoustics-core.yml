name: Acoustic control tests
on:
  push:
  pull_request:
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/test_acoustics.sh
      - run: ./gradlew :sample:testAcousticBridge
        working-directory: android-sdk-v5-as
